[project]
name = "learner"
version = "0.1.0"
description = "Single-user study app for fast technical review."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "ruff>=0.17.1",
    "sqlglot>=30.23.0",
    "anthropic>=1.15.0",
    "zstandard>=0.25.0",
    "markdownify>=1.2.3",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
learner = "learner.app:main"
learner-eval = "learner.evals:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
